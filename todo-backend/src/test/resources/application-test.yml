spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  
  h2:
    console:
      enabled: false
  
  flyway:
    enabled: false

# JWT Configuration for tests
jwt:
  secret: test-secret-key-for-testing-purposes-only-must-be-at-least-256-bits
  expiration: 3600000
  refresh-expiration: 86400000

# OAuth Configuration for tests (mock values)
google:
  client:
    id: test-google-client-id
    secret: test-google-client-secret
    redirect-uri: http://localhost:8080/oauth2/callback/google

github:
  client:
    id: test-github-client-id
    secret: test-github-client-secret
    redirect-uri: http://localhost:8080/oauth2/callback/github

# Logging
logging:
  level:
    com.pramithamj.todo: INFO
    org.hibernate.SQL: DEBUG
