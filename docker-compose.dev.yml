# Development override for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  postgres:
    ports:
      - "5432:5432"
    volumes:
      # Use named volume for dev to persist data between restarts
      - postgres_data_dev:/var/lib/postgresql/data

  backend:
    build:
      context: ./todo-backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Enable debug mode
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    ports:
      - "8080:8080"
      - "5005:5005"  # Debug port
    volumes:
      # Mount source for hot reload (requires spring-boot-devtools)
      - ./todo-backend/src:/app/src:ro
      - ./todo-backend/target:/app/target
      - backend_logs_dev:/app/logs

  frontend:
    build:
      context: ./todo-frontend
      dockerfile: Dockerfile.dev
      args:
        VITE_API_URL: http://localhost:8080
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "5173:5173"
    volumes:
      # Mount source for hot reload
      - ./todo-frontend/src:/app/src:ro
      - ./todo-frontend/public:/app/public:ro
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data_dev:
    name: todo-postgres-data-dev
  backend_logs_dev:
    name: todo-backend-logs-dev
